[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rage-garage"
version = "0.1.0"
description = "Windows-first GTA V vehicle conversion, metadata editing, validation, and pack-building studio."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "David" }
]
dependencies = [
  "PySide6>=6.8",
  "lxml>=5.3",
  "pydantic>=2.9",
  "numpy>=2.1",
  "moderngl>=5.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
rage-garage = "rage_garage.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["rage_garage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
